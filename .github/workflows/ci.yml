# =============================================================================
# PIPELINE CI/CD — Star Homes Android
# GitHub Actions — Arquivo: .github/workflows/ci.yml
# =============================================================================
#
# ESTRATÉGIA DE DEPLOY ESCOLHIDA: Firebase App Distribution
# ----------------------------------------------------------
# Justificativa:
#   • Gratuito para apps em desenvolvimento / MVP
#   • Integração nativa com o ecossistema Firebase já usado no projeto
#     (Crashlytics, Analytics, Performance)
#   • Permite distribuir builds para testadores sem passar pela Play Store,
#     acelerando o ciclo de feedback durante o desenvolvimento
#   • Suporte a grupos de testadores com controle de acesso por e-mail
#   • Quando o app estiver pronto para produção, o mesmo pipeline pode ser
#     estendido com o passo de upload para a Google Play via Fastlane
#
# FLUXO DO PIPELINE:
#   Push / PR em qualquer branch  →  job "build-and-test"  (lint + testes + build)
#   Push na branch "main"         →  job "deploy-firebase"  (distribuição para testadores)
#
# ETAPAS DO PIPELINE:
#   1. Checkout do código
#   2. Configuração do JDK 17
#   3. Cache das dependências Gradle (evita re-download a cada execução)
#   4. Android Lint (análise estática de qualidade de código)
#   5. Testes unitários (JUnit / Robolectric)
#   6. Build do APK debug
#   7. Upload do APK como artefato (disponível para download na aba Actions)
#   8. [Somente na main] Deploy via Firebase App Distribution
# =============================================================================

name: CI/CD — Star Homes

on:
  push:
    branches: [ "**" ]          # Executa em qualquer branch ao fazer push
  pull_request:
    branches: [ main, develop ] # Executa em PRs para main e develop

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 — Build, Lint e Testes
  # Executa em todo push e PR — garante que nenhum código quebrado chegue
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build, Lint & Testes
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configurar JDK 17 (mínimo exigido pelo AGP 8+)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache do Gradle — reduz o tempo de build em ~60%
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4. Permissão de execução para o Gradle wrapper
      - name: Permissão Gradle Wrapper
        run: chmod +x gradlew

      # 5. Android Lint — análise estática de qualidade
      - name: Lint
        run: ./gradlew lintDebug

      # 6. Testes unitários
      - name: Testes Unitários
        run: ./gradlew testDebugUnitTest

      # 7. Build do APK debug
      - name: Build APK Debug
        run: ./gradlew assembleDebug

      # 8. Upload do APK como artefato (disponível por 7 dias na aba Actions)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: starhomes-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # 9. Publica relatório de testes (visível na aba Actions do GitHub)
      - name: Publicar Relatório de Testes
        uses: actions/upload-artifact@v4
        if: always() # Publica mesmo se os testes falharem
        with:
          name: test-results-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 2 — Deploy via Firebase App Distribution
  # Executa SOMENTE quando há push na branch "main"
  # Depende do job anterior ter sido concluído com sucesso
  # ---------------------------------------------------------------------------
  deploy-firebase:
    name: Deploy — Firebase App Distribution
    runs-on: ubuntu-latest
    needs: build-and-test                    # Só roda se build-and-test passou
    if: github.ref == 'refs/heads/main'      # Somente na branch main

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Permissão Gradle Wrapper
        run: chmod +x gradlew

      - name: Build APK Release (não assinado para distribuição interna)
        run: ./gradlew assembleRelease

      # Deploy para Firebase App Distribution
      # FIREBASE_APP_ID e FIREBASE_TOKEN devem ser configurados em:
      # GitHub → Settings → Secrets and variables → Actions
      - name: Deploy Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers                    # Grupo de testadores no Firebase
          file: app/build/outputs/apk/release/app-release-unsigned.apk
          releaseNotes: |
            Build automático do commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Autor: ${{ github.actor }}